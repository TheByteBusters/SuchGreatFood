    <div class="productos-local">
        <h3>Lista de Productos</h3>
        <button class="btn btn-agregar" onclick="mostrarFormularioProducto()">
            <i class="fas fa-plus"></i> Agregar Producto
        </button>
        
        <div id="formularioProducto" class="formulario-producto" style="display: none;">
            <h4>Agregar Nuevo Producto</h4>
            <form id="nuevoProductoForm" onsubmit="agregarProductos(); return false;">
                <label for="categoriaProducto">Categoría:</label>
                <select id="categoriaProducto" required>
                    <option value="" disabled selected>Selecciona una categoría</option>
                    <option value="lomos">Lomos</option>
                    <option value="hamburguesas">Hamburguesas</option>
                    <option value="empanadas">Empanadas</option>
                    <option value="bebidas">Bebidas</option>
                    <option value="postres">Postres</option>
                </select>

                <label for="nombreProducto">Nombre:</label>
                <input type="text" id="nombreProducto" required />

                <label for="precioProducto">Precio:</label>
                <input type="number" id="precioProducto" required />

                <label for="detallesProducto">Detalles:</label>
                <input type="text" id="detallesProducto" />

                <label for="ingredientesProducto">Ingredientes:</label>
                <input type="text" id="ingredientesProducto" placeholder="Ej: tomate, lechuga" />

                <div class="form-buttons">
                    <button type="submit" class="btn">Agregar</button>
                    <button type="button" class="btn" onclick="ocultarFormularioProducto()">Cancelar</button>
                </div>
            </form>
        </div>

        <div class="card-lista-productos-local">
            <table>
                <thead class="encabezado-tabla">
                    <tr>
                        <th>Imagen</th>
                        <th>Categoría</th>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Detalles</th>
                        <th>Ingredientes</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="productos">
                    <!-- Productos se agregarán aquí -->
                </tbody>
            </table>
        </div>
    </div>
    
</div>
